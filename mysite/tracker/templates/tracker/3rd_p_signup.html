{% extends "base.html" %}
{% load i18n %}
{% load account %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-cyan-100 to-blue-100 flex items-center justify-center px-4">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">
      Welcome! Finish signing up
    </h2>

    <form method="post" action="{% url 'socialaccount_signup' %}">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="mt-4 w-full bg-cyan-600 text-white py-2 px-4 rounded hover:bg-cyan-700">
        Complete Sign Up
      </button>
    </form>
  </div>
</div>
{% endblock %}
