name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tracker_db
          POSTGRES_USER: tracker_user
          POSTGRES_PASSWORD: tracker_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: mysite
        env:
          SECRET_KEY: test-secret-key-for-ci
          IS_PRODUCTION: False
          OPENAI_API_KEY: test-key
          MISTRAL_API_KEY: test-key
          SOCIAL_AUTH_GOOGLE_CLIENT_ID: test-key
          SOCIAL_AUTH_GOOGLE_SECRET: test-key
          PAYPAL_CLIENT_ID: test-key
          PAYPAL_SECRET: test-key
          DATABASE_URL: postgresql://tracker_user:tracker_password@localhost:5432/tracker_db
          DB_SSL: False
        run: |
          python manage.py migrate
          python manage.py test tracker.tests
